name: CI
on:
  push:
    branches:
      - main
  pull_request:

# The jobs only read the repo, so the token gets no write access.
permissions:
  contents: read

# A new push to a PR cancels that PR's older run. Runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No secrets: the unit suites make no network or model calls, so CI can never
# spend subscription credit.
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json
      # The dashboard imports server types through @server/* -> ../src, which
      # resolve their own imports (zod, ...) from the root node_modules.
      - run: npm ci
      - run: npm ci --prefix dashboard
      - run: npm run typecheck --prefix dashboard
      - run: npm test --prefix dashboard
